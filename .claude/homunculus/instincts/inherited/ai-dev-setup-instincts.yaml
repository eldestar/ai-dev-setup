# Ai Dev Setup Workflow Single Source Of Truth Config Integration

## Action

Follow the single-source-of-truth-config-integration workflow:
1. Add or update config file(s) (e.g., config/models.csv, config/tools.csv, templates/CLAUDE.md.tmpl).
2. Update or refactor installer scripts (e.g., runners/install.ps1, setup-windows.ps1, SETUP.md) to consume the new config.
3. Update documentation (e.g., config/README.md, README.md, SETUP.md) to reference or explain the config.
4. Remove or deduplicate any inline or duplicated tables/lists in scripts and docs.
5. Test all installer paths to verify the config is correctly consumed.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: config/models.csv, config/tools.csv, templates/CLAUDE.md.tmpl

