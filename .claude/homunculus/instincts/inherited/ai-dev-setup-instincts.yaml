# Ai Dev Setup Workflow Secure Allowlist Skill Agent Installation

## Action

Follow the secure-allowlist-skill-agent-installation workflow:
1. Update skills-lock.json with new or changed allowlist entries (skills, agents, plugins, MCPs) and their commit SHAs.
2. Update or create install scripts for both platforms (scripts/install-skills.sh, scripts/install-skills.ps1) to use the allowlist and verify hashes.
3. Wire the install scripts into both runners/install.ps1 and SETUP.md.
4. Test end-to-end installation and hash verification on both platforms.
5. Document the changes in CHANGELOG.md.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: skills-lock.json, scripts/install-skills.sh, scripts/install-skills.ps1

